name: Java CI with Gradle

on: [push, pull_request]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          java-version: '11'
          distribution: 'temurin'
      - name: Make gradlew executable
        run: chmod +x gradlew
      - name: Start SUT
        run: java -Dspring.profiles.active=test -jar "artifacts/app-ibank.jar" &
      - name: Wait for SUT
        run: sleep 10
      - name: Build and test
        run: ./gradlew test -Dselenide.headless=true -Dchromeoptions.args="--no-sandbox,--disable-dev-shm-usage,--disable-gpu,--window-size=1280,720,--remote-allow-origins=*"
