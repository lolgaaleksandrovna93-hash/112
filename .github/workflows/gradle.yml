name: Java CI with Gradle

on: [push, pull_request]

jobs:
  build:
    # Явно указываем версию Ubuntu, чтобы избежать предупреждений о миграции на 26-ю версию
    runs-on: ubuntu-22.04
    
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        
      - name: Set up Java
        # Используем актуальную версию setup-java v5 (v4 устарела)
        uses: actions/setup-java@v5
        with:
          java-version: '11'
          distribution: 'temurin'
          cache: 'gradle'
          
      - name: Make gradlew executable
        run: chmod +x gradlew
        
      - name: Start SUT
        # Убедитесь, что путь к jar-файлу верный. Если файл лежит в artifacts/, оставляем как есть.
        run: java -Dspring.profiles.active=test -jar "artifacts/app-ibank.jar" &
        
      - name: Wait for SUT
        run: sleep 10
        
      - name: Build and test
        run: ./gradlew test
